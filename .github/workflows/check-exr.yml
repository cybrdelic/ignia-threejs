name: Independent OpenEXR validation
on:
  push:
    branches: [ignia-next-20260906]
    paths: ['.github/workflows/check-exr.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode exported pixels with two independent libraries
        env:
          OPENCV_IO_ENABLE_OPENEXR: '1'
        run: |
          python -m pip install --quiet numpy OpenEXR opencv-python-headless
          mkdir -p validation
          node tools/test_exr.cjs
          python - <<'PY'
          from pathlib import Path
          import numpy as np, OpenEXR, cv2, json, hashlib
          root=Path('validation');fixture=root/'exr_fixture.exr'
          assert fixture.is_file(), fixture.resolve()
          expected=np.fromfile(root/'exr_fixture.rgba32f',np.float32).reshape(4,8,4)
          with OpenEXR.File(str(fixture)) as f:
              observed=f.channels()['RGBA'].pixels
              error=float(np.abs(observed-expected).max())
              assert error==0, error
          other=cv2.imread(str(fixture),cv2.IMREAD_UNCHANGED)
          compatibility={'version':cv2.__version__,'decoded':other is not None}
          if other is not None:
              compatibility['maximum_absolute_error']=float(np.abs(other-expected[...,[2,1,0,3]]).max())
              assert compatibility['maximum_absolute_error']==0
          report={'pass':True,'independent_decoder':'Official OpenEXR Python module','decoder_version':OpenEXR.__version__,'maximum_absolute_error':error,'shape':list(observed.shape),'negative_values_preserved':bool(observed.min()<0),'hdr_values_preserved':bool(observed.max()>1),'file_sha256':hashlib.sha256(fixture.read_bytes()).hexdigest(),'opencv_compatibility':compatibility,'source_commit':__import__('os').environ['GITHUB_SHA']}
          (root/'exr_roundtrip.json').write_text(json.dumps(report,indent=2));print(report)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-exr-validation
          path: validation/
          retention-days: 3
