name: Publish original IGNIA media
on:
  push:
    branches: [ignia-verified-upgrade-20260906]
    paths: ['.github/workflows/publish-baseline-media.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ignia-verified-upgrade-20260906
      - name: Fetch exact user-authorized public media archive
        env:
          MEDIA_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-6c78-81f5-ad60-7ae6f2292388/raw?se=2026-09-06T23%3A42%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=3f53fd13-964c-5294-b9e2-19fce3e5a201&skoid=add8ee7d-5fc7-451e-b06e-a82b2276cf62&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-06T03%3A34%3A56Z&ske=2026-09-07T03%3A34%3A56Z&sks=b&skv=2026-02-06&sig=gSVtZVMx0q8fBOfOckWUlak8p8cw7KWYqVamU7%2BJGhc%3D'
        run: |
          curl --fail --location --retry 2 "$MEDIA_URL" -o /tmp/original-media.zip
          echo '09529ec9f543452f75886de1a65964a1c3f3eff95dbd055cb5985b4ef57dcb17  /tmp/original-media.zip' | sha256sum --check
          unzip -t /tmp/original-media.zip
          mkdir -p docs/media/baseline
          unzip -q /tmp/original-media.zip -d docs/media/baseline
      - name: Install media tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Encode every real clip, verify frames, and build gallery
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,json,hashlib,html
          root=Path('docs/media/baseline');videos=sorted(root.rglob('*.mp4'))
          assert len(videos)==43, len(videos)
          rows=[];cards=[]
          for p in videos:
              subprocess.run(['ffmpeg','-v','error','-i',str(p),'-f','null','-'],check=True)
              v=json.loads(subprocess.check_output(['ffprobe','-v','error','-select_streams','v:0','-show_entries','stream=width,height,nb_frames,r_frame_rate,duration','-of','json',str(p)]))['streams'][0]
              assert (v['width'],v['height'])==(1920,1080),v
              gif=p.with_suffix('.gif')
              graph='[0:v]fps=10,scale=480:-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=128[p];[b][p]paletteuse=dither=bayer:bayer_scale=3'
              subprocess.run(['ffmpeg','-v','error','-y','-threads','1','-i',str(p),'-filter_complex',graph,'-loop','0',str(gif)],check=True)
              rel=p.relative_to(root).as_posix();grel=gif.relative_to(root).as_posix()
              rows.append({'video':rel,'gif':grel,'video_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'gif_sha256':hashlib.sha256(gif.read_bytes()).hexdigest(),'gif_bytes':gif.stat().st_size,**v})
              label=html.escape(p.stem.replace('_',' '))
              cards.append(f'<article><a href="{rel}"><img loading="lazy" src="{grel}" alt="{label}"></a><h2>{label}</h2><a href="{rel}">Original 1080p MP4</a> · <a href="{grel}">Animated GIF</a></article>')
              print('VERIFIED',rel,flush=True)
          report={'input_archive_sha256':'09529ec9f543452f75886de1a65964a1c3f3eff95dbd055cb5985b4ef57dcb17','original_video_count':len(rows),'gif_count':len(rows),'all_original_mp4_decode_checks_passed':True,'conversion':'480 px wide, 10 fps, 128-color GIF from the complete original moving clip. No generated image inputs.','source_version':'Previously delivered PYRE rebuilt baseline; NOT the later upgrade.','files':rows}
          (root/'publication-manifest.json').write_text(json.dumps(report,indent=2))
          (root/'index.html').write_text('<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>IGNIA · 43 recorded scenes</title><style>body{background:#090d13;color:#e6edf3;font:16px system-ui;margin:32px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px}article{padding:16px;background:#141c27}img{width:100%}h2{font-size:17px}a{color:#ffbd80}p{max-width:900px;line-height:1.6}</style><h1>IGNIA / original recorded scene archive</h1><p>43 actual code-rendered recordings, retained byte-for-byte from the previously delivered archive. GIFs are new downsampled previews of those clips. These are baseline results, not proof of an upgraded solver or EmberGen parity.</p><p><a href="publication-manifest.json">Hashes, resolution, duration, and conversion manifest</a></p><main>'+''.join(cards)+'</main></html>')
          readme=Path('README.md');s=readme.read_text();s=s.replace('docs/media/ignia-overview-v7.gif','docs/media/baseline/catalogue/01_hearth.gif').replace('docs/media/ignia-combustors-v7.gif','docs/media/baseline/catalogue/05_stove4.gif').replace('docs/media/ignia-vortices-v7.gif','docs/media/baseline/catalogue/20_tornado.gif').replace('docs/media/ignia-transients-v7.gif','docs/media/baseline/catalogue/23_mushroom.gif')
          s+='\n## Complete recorded media\n\n[All 43 GIFs and original 1080p clips](docs/media/baseline/) · [HTML scene gallery](docs/media/baseline/index.html) · [Per-file hashes and decode checks](docs/media/baseline/publication-manifest.json). These are the original rebuilt baseline recordings, not claimed EmberGen-equivalent results.\n'
          readme.write_text(s)
          PY
      - name: Commit the verified binary media
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/media/baseline README.md
          git commit -m 'Publish 43 original 1080p recordings and full-motion GIF previews'
          git push origin HEAD:ignia-verified-upgrade-20260906
      - uses: actions/upload-artifact@v4
        with:
          name: ignia-media-publication-manifest
          path: docs/media/baseline/publication-manifest.json
          retention-days: 3
