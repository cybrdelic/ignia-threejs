name: Import verified IGNIA 0.5 source
on:
  push:
    branches: [ignia-next-20260906]
    paths: ['.github/workflows/import-next-source.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ignia-next-20260906
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch exact authorized source bundle
        env:
          SOURCE_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-c010-81f5-9f7a-b47b531bf363/raw?se=2026-09-07T00%3A14%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=ef67c2a1-8c09-5a29-94de-06fc1fb19a83&skoid=add8ee7d-5fc7-451e-b06e-a82b2276cf62&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-06T03%3A48%3A18Z&ske=2026-09-07T03%3A48%3A18Z&sks=b&skv=2026-02-06&sig=H%2B3TPZ1YpEq2sZ5OOlFGXIVkdW5J%2BCXHAwT5lk%2BRlqE%3D'
        run: |
          curl --fail --location --retry 2 "$SOURCE_URL" -o /tmp/next-source.zip
          echo '94487afcd9ee8c0da811aad2e948a961850e9ced0ceaa5d35ab8d8bc6dfec6dd  /tmp/next-source.zip' | sha256sum --check
          python - <<'PY'
          from pathlib import Path
          import zipfile,json,hashlib
          with zipfile.ZipFile('/tmp/next-source.zip') as z:
              names=z.namelist()
              for name in names:
                  p=Path(name)
                  assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
                  assert p.parts[0] in ['src','tools','vendor','README.md','UPGRADE.md','LICENSE','index.html','package.json','presets.json','requirements.txt','.gitignore','SOURCE_SHA256.json']
              manifest=json.loads(z.read('SOURCE_SHA256.json'))
              for name,expected in manifest.items():assert hashlib.sha256(z.read(name)).hexdigest()==expected,name
              z.extractall('.')
          obsolete=['engine-gpu.js','engine-flow-core.js','engine-shaders-material.js','engine-shaders-render.js','engine-renderer.js','engine-main.js','detail-core.js','presets-data.js','presets-runtime.js','presets-glsl.js','presets-data.0.b64','presets-data.1.b64','presets-data.2.b64','presets-data.3.b64']
          for name in obsolete:
              p=Path('src')/name
              if p.is_file() and str(p) not in manifest:p.unlink()
          print('VERIFIED',len(manifest),'source files; baseline media untouched')
          PY
      - name: Parse actual runtime and build reproducible shader exports
        run: |
          npm install --ignore-scripts
          npm run check
          npm run export-shaders
          npm run export-detail
          npm run export-diagnostics
          node tools/build_standalone.cjs /tmp/IGNIA_Next_Studio.html
          python -m compileall -q tools
          mkdir -p validation
          node tools/test_exr.cjs
      - name: Commit corrected runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src tools vendor README.md UPGRADE.md LICENSE index.html package.json package-lock.json presets.json requirements.txt .gitignore SOURCE_SHA256.json
          git commit -m 'IGNIA 0.5: corrected MAC transport, GPU embers, stable optics and FLOAT EXR passes'
          git push origin HEAD:ignia-next-20260906
          git rev-parse HEAD > /tmp/IGNIA_source_commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ignia-next-source-proof
          path: |
            /tmp/IGNIA_Next_Studio.html
            /tmp/IGNIA_source_commit.txt
          retention-days: 3
